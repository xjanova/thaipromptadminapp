name: thaipromptadmin
description: "ไทยพร้อม แอดมิน — ศูนย์ควบคุมหลังบ้าน main.thaiprompt.online บนมือถือ"
publish_to: 'none'

version: 0.3.0+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Core ──
  cupertino_icons: ^1.0.8
  intl: any                            # follow flutter_localizations pin

  # ── State management & DI ──
  flutter_riverpod: ^2.6.1

  # ── Routing ──
  go_router: ^14.6.2

  # ── Networking ──
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ── Storage ──
  flutter_secure_storage: ^9.2.2       # token (Keychain / Keystore)
  shared_preferences: ^2.3.3           # non-sensitive prefs

  # ── UI ──
  phosphor_flutter: ^2.1.0             # ไอคอนเส้นชุดเดียวกับแอปลูกค้า
  mobile_scanner: ^5.2.3               # QR scanner (camera)

  # ── Device / app info ──
  package_info_plus: ^8.1.1
  device_info_plus: ^11.2.0
  url_launcher: ^6.3.1

  # ── Auth hardening (Phase 12) ──
  local_auth: ^2.3.0                   # fingerprint / face / device auth
  crypto: ^3.0.5                       # sha256 for PIN hash
  permission_handler: ^11.3.1          # REQUEST_INSTALL_PACKAGES

  # ── Auto-update (OTA APK install) ──
  ota_update: ^7.0.0                   # in-app APK download + install (Android)
  image_picker: ^1.2.4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true                       # enable l10n generator
  assets:
    - assets/images/icons/
    - assets/images/brand/

  # ฟอนต์ฝังในแอป (ไม่โหลดจากเน็ตตอนเปิด) — Anuphan = ข้อความทั้งหมด, Noto Serif Thai = หัวเรื่องรอยัล
  fonts:
    - family: Anuphan
      fonts:
        - asset: assets/fonts/Anuphan-Light.ttf
          weight: 300
        - asset: assets/fonts/Anuphan-Regular.ttf
          weight: 400
        - asset: assets/fonts/Anuphan-Medium.ttf
          weight: 500
        - asset: assets/fonts/Anuphan-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Anuphan-Bold.ttf
          weight: 700
    - family: NotoSerifThai
      fonts:
        - asset: assets/fonts/NotoSerifThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerifThai-Bold.ttf
          weight: 700
